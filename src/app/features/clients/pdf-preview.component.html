<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-3 sm:p-6" role="presentation" (click)="closed.emit()">
  <section
    class="flex h-full max-h-[92vh] w-full max-w-4xl flex-col overflow-hidden rounded-lg bg-white shadow-2xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="pdf-preview-title"
    (click)="$event.stopPropagation()"
  >
    <header class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 px-4 py-3 sm:px-5">
      <div class="min-w-0">
        <p class="text-[10px] font-medium text-slate-500">Vista previa de la ficha</p>
        <h2 id="pdf-preview-title" class="truncate text-sm font-semibold text-slate-900">
          {{ preview().client.fullName }}
          <span class="ml-1.5 rounded bg-slate-100 px-1.5 py-0.5 font-mono text-[10px] font-semibold text-slate-600">{{ preview().client.crmId }}</span>
        </h2>
      </div>
      <div class="flex items-center gap-2">
        @if (objectUrl()) {
          <span class="hidden text-[10px] text-slate-400 sm:inline">PDF · {{ sizeKb() }} KB</span>
          <button type="button" class="h-8 rounded-md border border-slate-200 px-3 text-[11px] font-medium text-slate-600 hover:bg-slate-50" (click)="openInNewTab()">Abrir en pestaña</button>
        }
        <button
          type="button"
          class="inline-flex h-8 items-center gap-1.5 rounded-md bg-teal-700 px-3 text-[11px] font-semibold text-white hover:bg-teal-800 disabled:opacity-50"
          [disabled]="!preview().blob"
          (click)="download.emit()"
        >
          <svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19h14" /></svg>
          Descargar PDF
        </button>
        <button type="button" class="grid size-8 place-items-center rounded-md text-slate-500 hover:bg-slate-100" aria-label="Cerrar vista previa" (click)="closed.emit()">
          <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
    </header>

    <div class="relative flex-1 bg-slate-100">
      @if (preview().loading) {
        <div class="absolute inset-0 grid place-items-center" aria-busy="true">
          <div class="text-center">
            <span class="mx-auto block size-8 animate-spin rounded-full border-2 border-teal-200 border-t-teal-700"></span>
            <p class="mt-3 text-[11px] text-slate-500">Generando la ficha en el servidor…</p>
          </div>
        </div>
      } @else if (preview().error; as message) {
        <div class="absolute inset-0 grid place-items-center p-6">
          <div class="max-w-sm text-center">
            <p class="text-[12px] font-medium text-rose-700" role="alert">{{ message }}</p>
            <button type="button" class="mt-3 h-8 rounded-md border border-slate-200 bg-white px-3 text-[11px] font-medium text-slate-700 hover:bg-slate-50" (click)="retry.emit()">Reintentar</button>
          </div>
        </div>
      } @else if (safeUrl(); as url) {
        <iframe class="size-full border-0" [src]="url" [title]="'Ficha PDF de ' + preview().client.fullName"></iframe>
      }
    </div>
  </section>
</div>
